# jshsp2.eds-tech.cn — 集市商家 / 直约服务商「管理台」子路径静态站点
#
# 【白屏/打不开常见原因】index.html 里 script 必须是「子路径 + /assets/」，例如：
#   /market-console/assets/index-xxxxx.js
#   /service-provider-console/assets/index-xxxxx.js
# 若误把运营中台 admin/dist（根路径 /assets/...）拷到子目录，浏览器会去根站拉 JS，页面无法运行。
# 正确做法：在仓库内执行 ./deploy/sync-console-dist.sh（或分别 build 两个 console 再 rsync）。
#
# 将构建产物放到站点根下对应子目录（与 Vite base 一致），例如：
#   /www/wwwroot/jshsp2/market-console/index.html  ← admin-market-console 的 dist 内容
#   /www/wwwroot/jshsp2/service-provider-console/index.html  ← admin-service-provider-console 的 dist
#
# 在已有 HTTPS server（与运营中台同源、已反代 /api）内追加以下 location。
# 勿长期缓存入口 HTML，避免发版后仍引用旧 hash chunk。

location ^~ /market-console/ {
    root /www/wwwroot/jshsp2;
    index index.html;
    try_files $uri $uri/ /market-console/index.html;
}

location ^~ /service-provider-console/ {
    root /www/wwwroot/jshsp2;
    index index.html;
    try_files $uri $uri/ /service-provider-console/index.html;
}

# 与 admin 一致：入口 HTML 不长期缓存；带 hash 的 assets 可长缓存
location = /market-console/index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
location = /service-provider-console/index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location ^~ /market-console/assets/ {
    root /www/wwwroot/jshsp2;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}
location ^~ /service-provider-console/assets/ {
    root /www/wwwroot/jshsp2;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# 本地开发（不经 Nginx）：
#   cd admin-market-console && npm run dev   → http://<host>:5185/market-console/
#   cd admin-service-provider-console && npm run dev → http://<host>:5186/service-provider-console/
