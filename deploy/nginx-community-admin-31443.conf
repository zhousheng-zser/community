# 管理后台 + API 同源（HTTP，端口 31443）
# 用于域名（如 jshsp2.eds-tech.cn）时：把 server_name 改为该域名；HTTPS 见文末示例。
# 侧栏「???」多为 index.html 被缓存、仍引用旧主包 hash，与懒加载 chunk 不一致——务必让入口 HTML 不长期缓存。
#
# 用法：
#   1) cd admin && npm run build
#   2) sudo cp deploy/nginx-community-admin-31443.conf /etc/nginx/sites-available/community-admin
#   3) sudo ln -sf /etc/nginx/sites-available/community-admin /etc/nginx/sites-enabled/
#   4) 按需修改下方 root 为服务器上 admin/dist 的真实路径
#   5) sudo nginx -t && sudo systemctl reload nginx
# 阿里云安全组：入方向放行 TCP 31443
#
# 访问：http://<公网IP>:31443
# 管理端构建请使用 admin/.env.production 中 VITE_API_BASE=/api/v1（与当前页同源）
#
# 静态目录勿放在 /root 下：进程用户（www-data 或 www）需可读。
# 宝塔：站点 root 多为 /www/wwwroot/community-admin，发布用仓库内 deploy/sync-admin-dist.sh（或 ./admin/restart.sh）。
# 纯 Nginx 示例可把下方 root 改为你的目录（如 /var/www/...），并自行 rsync dist。

server {
    listen 31443;
    listen [::]:31443;
    # 域名访问时改为：server_name jshsp2.eds-tech.cn;
    server_name _;

    # 宝塔示例请改为：root /www/wwwroot/community-admin;
    root /var/www/community-admin/dist;
    index index.html;

    charset utf-8;
    source_charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 入口 HTML 必须可更新，否则用户一直用旧 index 里旧的 /assets/index-xxxxx.js → 易出现界面「???」
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Vite 带 hash 的文件名可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 与小程序 API 同机部署时：若 :3000 为 Nginx SSL（见 community-mini-https-3000.conf）→ 后端在 :3001，此处必须写 3001，勿写 3000。
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# 若要在 443/31443 上启用 HTTPS（jshsp2.eds-tech.cn）：
#   · 证书 SAN 须包含 jshsp2.eds-tech.cn，否则浏览器报证书与域名不符
#   · 将上方 server 块改为 listen 443 ssl;（或你实际端口），并设置 server_name jshsp2.eds-tech.cn;
#   · 复制本文件中的 charset、gzip、/index.html 与 /assets/ 的 Cache-Control 规则到该 server
#   · 部署后：若有 CDN，对 / 与 /index.html 做刷新；用户可 Ctrl+F5
# 构建时 VITE_API_BASE 仍为 /api/v1（同源）
